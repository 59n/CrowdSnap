services:
  web:
    build: .
    ports:
      # Always publish the app on host :3000 (container listens on 3000)
      - "3000:3000"
    volumes:
      - ./storage:/app/storage
      # Persist admin settings (settings.json) across container restarts
      - ./data:/app/data
      # Replica SSD bind lives in docker-compose.ssd.yml and is attached by
      # scripts/ssd-watch.sh only when /Volumes/1TB is actually mounted.
      # Putting it here would take the site down if the drive is unplugged.
    env_file:
      - .env
    environment:
      # Host .env uses localhost for `next dev` / tools on the Mac.
      # Inside Compose, Postgres is reachable only as the service name "db".
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      PG_POOL_MAX: 50
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Bind localhost only — do not expose Postgres on the LAN/internet
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
